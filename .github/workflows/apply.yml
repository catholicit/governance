# Makes the organization match org.yaml with Peribolos after every merge, and
# once a day to undo any change made by hand outside the vote.
name: apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Samo prikaži plan"
        type: boolean
        default: true

concurrency:
  group: apply
  cancel-in-progress: false

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install --quiet pyyaml
      - name: Render config
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/render.py > "$RUNNER_TEMP/rendered.yaml" && cat "$RUNNER_TEMP/rendered.yaml"
      - name: Peribolos
        env:
          PERIBOLOS_APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          APP_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          export PERIBOLOS_APP_KEY_FILE="$RUNNER_TEMP/app.pem"
          (umask 077; printf '%s\n' "$APP_KEY" > "$PERIBOLOS_APP_KEY_FILE")
          unset APP_KEY
          confirm=--confirm
          [ "$DRY_RUN" = "true" ] && confirm=
          scripts/peribolos.sh "$RUNNER_TEMP/rendered.yaml" $confirm 2>&1 \
            | tee "$RUNNER_TEMP/peribolos.log" | python3 scripts/peribolos_plan.py
